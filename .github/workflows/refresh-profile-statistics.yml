name: Refresh profile statistics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out statistics branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7.0.1
        with:
          ref: stats

      - name: Generate statistics
        uses: cicirello/user-statistician@36500351ea14b69e68217d4c89eb0f3f06680b17 # v1.26.3
        with:
          image-file: images/userstats.svg
          commit-message: "chore: refresh profile statistics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
